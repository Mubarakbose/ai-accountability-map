version: "3.8"
services:
  db:
    image: postgres:15-alpine
    container_name: aiacc-db
    environment:
      POSTGRES_DB: ai_accountability
      POSTGRES_USER: aimap_user
      POSTGRES_PASSWORD: root
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d
    ports:
      - "8080:5432"          # optional: connect from host PG client
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimap_user -d ai_accountability"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiacc-backend
    env_file:
      - ./backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"                # only inside the compose network
    # uncomment if you want to hit backend directly from host for debugging
    # ports:
    #   - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --root-path /api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiacc-frontend
    depends_on:
      - backend
    ports:
      - "80:80"               # app served at http://localhost
    # no env_file here; production build calls /api and nginx proxies it

volumes:
  db-data:
